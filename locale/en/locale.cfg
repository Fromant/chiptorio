[technology-description]
automation-science-pack=Craft your first Analytical Engine to start producing punched cards.
electromechanics=Relay logic, wired control, and the first programmable behaviour.\nUnlocks the circuit network.
thermionics=Sand, glass, vacuum tubes, and a computer that is actually faster than an analytical engine.
semiconductor-physics=Turning sand into electronic-grade silicon. Unlocks the Crystal Puller. Requires chemical science.
crystal-growth=Pulling single crystals, sawing them into wafers, and polishing them flat.
photolithography=The first true chip process: resist, masks, exposure, etch, metallisation.\nUnlocks the Wafer Fab. This is where a factory becomes a fab.
process-10um=Contact lithography, PMOS transistors and 50 mm wafers.\nUnlocks the 10 µm mask, wafer and die, and packaging for integrated circuits.
process-3um=Projection lithography, CMOS and 100 mm wafers.\nUnlocks the 3 µm process and microprocessor packaging.
process-1um=i-line lithography and 150 mm wafers. The last node that fits in the Wafer Fab.\nUnlocks the 1 µm process.
process-350nm=KrF deep-UV lithography, 200 mm wafers and BGA packaging.\nUnlocks the 350 nm process, system-on-chip packaging and the Optical Disc workload.
process-180nm=Deep-UV projection with flip-chip packaging.\nUnlocks the 180 nm process.
process-90nm=ArF deep-UV, strained silicon and 300 mm wafers.\nUnlocks the 90 nm process, GPU packaging and the HBM Stack workload.
process-45nm=Immersion lithography and high-k metal gates.\nUnlocks the 45 nm process.
process-22nm=Multi-patterning and the first FinFETs.\nUnlocks the 22 nm process and multi-core CPU packaging.
process-14nm=Second-generation FinFETs on a 300 mm line.\nUnlocks the 14 nm process.
process-7nm=EUV lithography and chiplet packaging.\nUnlocks the 7 nm process and quantum processor packaging.
process-3nm=EUV with gate-all-around transistors and 3D packaging.\nUnlocks the 3 nm process.
process-1-4nm=High-NA EUV, CFETs and hybrid bonding. The end of the roadmap.\nUnlocks the 1.4 nm process.
planar-process=Many devices on one die, wired in one planar layer.\nUnlocks the Mainframe Cluster. Integrated circuits themselves arrive with the 10 µm process.
microarchitecture=Pipelining, caches and instruction sets. A theory technology: it gates the Internet and the 1 µm node.
internet=Wire the factory together. Cables, switches, routers and a monitor turn separate machines into one network.\nThe Internet is also the first compute tier: it unlocks the Assembly Fab, the Server Rack, the Memory Bank and SRAM modules.\nThis is the first technology that supplies compute instead of consuming it.
vlsi-process=Deep-UV lithography, phase-shift masks and chemical-mechanical planarisation.\nUnlocks the VLSI Fab and the Cooling Tower, and opens the 350 nm process.
datacenter=A hall of racks, cooling units and enough power to make the lights dim.\nUnlocks the Datacenter compute provider, the Datacenter Lab and DRAM modules.
advanced-packaging=Multiple dies on one interposer, plus stacked memory. Unlocks chiplet and HBM stack packaging.
heterogeneous-compute=Many cores, one package, and a compiler problem for the ages. A theory technology: it gates the 22 nm node.
quantum-computing=Superconductors, cryogenics and the first physical qubits.\nUnlocks the Quantum Fab, the Cryostat and the Qubit Array workload.
quantum-error-correction=Bundle nine physical qubits into one logical qubit. The correction cycle is a production line, not a formula.
quantum-advantage=Logical qubits at scale. A theory technology: it gates The Question.
the-question=Every workload, every chip, one question. Requires every Chiptorio technology and a sustained supply of all nine workloads plus microprocessors.\nUnlocks the Answer Engine. Each level asks for more production and awards more answer score.
refine-6um=A tighter contact process between 10 µm and 3 µm.\nUnlocks the Metrology Lab, the test structure and the 6 µm pilot line. Runs offline; the bonus applies once the Metrology Lab has analysed the batch.\nBonus: more wafer yield, slightly more compute, slightly less provider power.
refine-1-5um=A projection process between 3 µm and 1 µm.\nUnlocks the 1.5 µm pilot line. Runs offline.\nBonus: more wafer yield, slightly more compute, slightly less provider power.
refine-800nm=The first refinement that cannot be analysed offline: from here the Metrology Lab needs a network with compute, memory and bandwidth.\nUnlocks the 800 nm pilot line.\nBonus: more wafer yield, slightly more compute, less provider power.
refine-250nm=Copper-ready half-node between 350 nm and 180 nm.\nRequires a network that reaches the qualification gate.\nBonus: more wafer yield, slightly more compute, less provider power.
refine-130nm=A 300 mm-ready extension of the 180 nm process.\nRequires a network that reaches the qualification gate.\nBonus: more wafer yield, more compute, less provider power.
refine-65nm=The first refinement that asks for vector compute as well as scalar.\nUnlocks the 65 nm pilot line.\nBonus: more wafer yield, more compute, less provider power.
refine-32nm=High-k refinement between 45 nm and 22 nm.\nRequires a mixed scalar and vector network.\nBonus: more wafer yield, more compute, less provider power.
refine-10nm=Multi-patterning refinement between 14 nm and 7 nm.\nRequires a mixed scalar and vector network.\nBonus: more wafer yield, more compute, less provider power.
refine-5nm=Gate-all-around refinement between 7 nm and 3 nm.\nRequires an even split of scalar and vector compute.\nBonus: more wafer yield, more compute, even less provider power.
refine-2nm=High-NA readiness for the last step before 1.4 nm.\nRequires an even split of scalar and vector compute.\nBonus: the largest yield gain in the ladder, more compute, even less provider power.

