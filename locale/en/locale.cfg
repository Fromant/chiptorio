[item-description]
silica=Crushed stone, sorted and washed. The feedstock for glass and for every chip you will ever build.
glass=Plain glass. Needed for vacuum tubes, masks and eventually for optics.
metallurgical-silicon=98% pure silicon from carbothermic reduction. Not good enough for devices.
polysilicon=Electronic-grade polysilicon. Nine nines, or it is just expensive sand.
monocrystalline-ingot=A single silicon crystal, pulled slowly from the melt.
silicon-wafer=Sliced, lapped and polished. This is where sand stops being sand.
litho-mask=The pattern of one layer of one chip. Masks wear out; keep a stock.
exposed-wafer=Photoresist has been cured through the mask.
etched-wafer=The pattern is now physical.
processed-wafer=Metallised and ready to be diced.
bare-die=One transistor network per square millimetre, before packaging.
phase-shift-mask=A tighter mask that shifts the light instead of just blocking it. The old mask is the substrate.
low-k-dielectric=A porous insulator that keeps copper layers from talking to each other.
cooling-unit=A packaged heat exchanger. The Datacenter is built out of these, not fans.
superconductor=Copper, steel and acid in the right crystal structure. Conducts with no resistance once the cryostat is cold.
vacuum-tube=A heated filament in a glass envelope. Slow, hot, and the beginning of computing.
discrete-transistor=One device, one package. The first real chip generation.
integrated-circuit=Many devices on one die. The computer becomes small enough to matter.
microprocessor=The whole machine on a chip. Everything downstream of this needs one.
system-on-chip=CPU, cache and I/O in one package. The chip stops being a component and becomes a computer.
chiplet=A known-good die on an interposer. The package is now larger than the chip.
hbm-stack=Memory dies stacked and bonded. Bandwidth is a physical property now.
gpu=A chiplet plus a memory stack, built to do one thing very fast and very hot.
multi-core-cpu=Several chiplets in one package. The compiler's problem, not the fab's.
qubit=One superconducting loop, controlled by one VLSI die. It decoheres if you look at it wrong.
error-corrected-qubit=Nine physical qubits agreeing on one logical answer. Expensive, and the only kind that scales.
quantum-processor=Several logical qubits and their control electronics in one package. It is very good at a very small set of problems.
qubit-array=A rack of physical qubits, formatted as a research workload. The Cryostat reads it one correction cycle at a time.
optical-disc=A write-once research disc, read back by laser. The optical tier of the workload chain.
hbm-science=Bonded memory dies, formatted as a research workload. Bandwidth you can hold in your hand.
punched-card=The first workload. Punched by hand, read by an analytical engine.
punched-tape=A continuous record of a program, read by relays.
magnetic-tape=Programs you can erase and rewrite. The mainframe era.
disk-pack=Random access. Research stops being a tape queue.
solid-state-drive=No moving parts. The first medium fast enough for real compute.
mainframe-module=A rack of compute, ready to be installed in a research cluster.
analytical-engine=A mechanical computer. It is slow, it is loud, and it is the only way to research anything.
tube-mainframe=A room full of valves. Faster than the engine, and it heats the room for free.
mainframe-cluster=A rack of silicon machines. Where a real research programme lives.
datacenter-lab=A hall of racks and heat exchangers. The first research machine that needs a supply chain of its own.
datacenter=A compute provider: eight chip slots, four memory slots and a hundred bandwidth of backplane. It holds chips as modules and supplies the network.
wafer-fab=A cleanroom in a box: coat, expose, etch, metallise, dice. Handles fluids, so it can run the whole lithography chain.
crystal-puller=Pulls a single silicon crystal out of the melt and saws it into wafers. Hot, slow, and irreplaceable.
assembly-fab=Packages dies into chips, systems and multi-core parts. Every compute module in the mod is built here.
server-rack=A compute provider: four chip slots, no memory slots, and a small backplane. The first machine that turns chips into network compute.
memory-bank=A storage provider: four memory slots and no chip slots. Research needs memory as much as it needs compute.
sram-module=A memory module. Small capacity, cheap, and the first memory a network can hold.
dram-module=A memory module. Eight times the capacity of SRAM, and the reason datacenter-scale research works.
vlsi-fab=Deep-UV lithography, CMP, copper fill and GPU assembly. The chilled, fluid-hungry successor to the Wafer Fab.
cooling-tower=Turns water and steam into coolant for the VLSI line. Without it, the fab is a very expensive heater.
quantum-fab=Superconducting qubits, error correction and quantum processor assembly. Everything here runs on cryogen.
cryostat=A research computer at millikelvin temperatures. Eight module slots, and a power bill to match.
answer-engine=Five by five tiles of every era of the factory, asking one question. Feed it a sustained production rate, not science packs.
metrology-test-structure=A known-good test pattern exposed alongside the pilot wafers. The Metrology Lab measures it to calibrate the line.
metrology-lab=Analyses pilot wafers for a half-node refinement. Feed it Process Qualification Wafers; the refinement activates when the batch is complete.
refine-6um-qualification-wafer=A small batch of wafers from the 6 µm pilot line, waiting for the Metrology Lab.
refine-1-5um-qualification-wafer=A small batch of wafers from the 1.5 µm pilot line, waiting for the Metrology Lab.
refine-800nm-qualification-wafer=A small batch of wafers from the 800 nm pilot line, waiting for the Metrology Lab.
refine-250nm-qualification-wafer=A small batch of wafers from the 250 nm pilot line, waiting for the Metrology Lab.
refine-130nm-qualification-wafer=A small batch of wafers from the 130 nm pilot line, waiting for the Metrology Lab.
refine-65nm-qualification-wafer=A small batch of wafers from the 65 nm pilot line, waiting for the Metrology Lab.
refine-32nm-qualification-wafer=A small batch of wafers from the 32 nm pilot line, waiting for the Metrology Lab.
