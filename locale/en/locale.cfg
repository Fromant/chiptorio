[entity-description]
analytical-engine=Mechanical research computer. Feed it punched cards.
tube-mainframe=A valve-based mainframe. Faster, hungrier, and accepts every workload.
mainframe-cluster=A silicon research cluster with module slots.
datacenter-lab=A datacenter-sized research computer with six module slots and a serious power bill.
datacenter=A network compute provider. Insert chips to supply compute and memory modules to store datasets.
wafer-fab=Cleanroom processing: lithography, etch, metallisation and dicing.
crystal-puller=Produces metallurgical silicon and monocrystalline ingots.
assembly-fab=Packages chips, systems on a chip, GPUs and multi-core CPUs. Modules go in, chips come out.
server-rack=A network compute provider with four chip slots. Build chips, insert them, get compute.
memory-bank=A network storage provider with four memory slots. No memory modules means no research.
vlsi-fab=Deep-UV exposure, CMP, dicing and GPU assembly. Consumes coolant.
cooling-tower=Produces coolant from water and steam for the VLSI line.
quantum-fab=Superconducting qubits, error correction and quantum processor assembly. Everything here runs on cryogen.
cryostat=A research computer at millikelvin temperatures. Eight module slots, and a power bill to match.
answer-engine=The final machine. It has no science-pack inputs; it only watches the factory. Open it to see the required rates and boot the computation.
network-cable=A single cable tile. Connects to adjacent cable tiles and reaches machines up to two tiles away. Runs under everything.
network-switch=Merges the cable runs around it into one subnet and adds backplane bandwidth.
network-router=Joins subnets into one network without merging them. Adds latency but extends reach.
network-monitor=Shows topology, subnet statistics and network totals. Also toggled by the monitor shortcut.
metrology-lab=Analyses pilot wafers. It has no science-pack inputs and cannot research; it only qualifies half-node refinements. From 800 nm it must be on a network that meets the qualification gate.
qln-import-node=Pulls items from adjacent output inventories into the storage group behind this network.
qln-export-node=Pushes items from the storage group into adjacent input inventories.
qln-provider-node=Uploads its buffer into the storage group. Feed it with inserters or belts.
qln-requester-node=Set its filter with one item, then it keeps adjacent inventories stocked from the storage group.
qln-terminal=Deposit your inventory or withdraw a stack from the storage group behind this network.
qln-storage-drive=Provides QLN item storage from its memory modules. Four module slots.
construction-core=Builds ghosts and mines deconstruction targets in a wide radius, paid for from QLN storage.
quantum-entanglement-core=Pairs with another core to share one storage group between two networks.
foup-dock=Seals wafers into a FOUP or unseals a FOUP into wafers.
network-repeater=Extends a cable run over an eight-tile gap.
wireless-access-point=Joins another access point within sixteen tiles without cable.

